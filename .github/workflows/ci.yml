name: RetirePilot synthetic CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Require migrated source
        run: |
          test -f retirepilot/api.py || { echo '::error::Source migration incomplete: retirepilot/api.py absent'; exit 1; }
          test -f tests/test_end_to_end.py || { echo '::error::Tests not imported'; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify release document integrity
        run: python scripts/verify_release_documents.py
      - name: Unit and integration suite
        run: python -m pytest -q
      - name: 96-archetype rule contracts
        env:
          PYTHONPATH: .
        run: python audit/run_rule_contracts_v22.py
      - name: API smoke checks (localhost, synthetic only)
        run: |
          python -m uvicorn retirepilot.api:app --host 127.0.0.1 --port 8766 > /tmp/rp-api.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8766/api/sample >/dev/null; then break; fi
            sleep 1
          done
          python audit/run_api_checks.py
